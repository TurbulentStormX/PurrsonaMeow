# Render "Blueprint": describes the web service so it can be created in one go (see docs/DEPLOY.md).
services:
  - type: web
    name: cat-cafe
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CAFE_TIMEZONE
        value: Asia/Singapore
      - key: RESET_CODE_MODE
        value: console
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AISHA_PASSWORD
        sync: false
      - key: BEN_PASSWORD
        sync: false
      # Optional booking emails through EmailJS (see docs/EMAIL.md). Leave them out and no emails are sent.
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_BOOKING_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PAYMENT_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
