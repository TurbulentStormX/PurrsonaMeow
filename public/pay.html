<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Café Reservations - Payment</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="pay-design.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <div class="layout">
    <nav id="side-nav" class="side-nav"></nav>

    <main class="payment-page">
  <div class="payment-container">

    <div class="payment-heading">
      <span class="payment-eyebrow">PURRSONA MEOW</span>
      <h1>Complete Your Booking</h1>
      <p>
        You're one step closer to spending a lovely
        day with our furry friends!
      </p>
    </div>

    <div class="payment-card">
      <div id="payBox"></div>
    </div>

    <p class="payment-footer-note">
      Thank you for choosing Purrsona Meow.
      We can't wait to welcome you!
    </p>

  </div>
</main>
  </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="storage.js"></script>
  <script src="data.js"></script>
  <script src="bookings.js"></script>
  <script src="actions.js"></script>
  <script src="layout.js"></script>
  <script>

    onDataReady(async function () {
    renderLayout('pay.html');
    if (guardPage(['guest'], 'pay for a session')) initPay();

    function initPay() {
      const user = currentUser();
      const code = (new URLSearchParams(window.location.search).get('code') || '').toUpperCase();
      const box = document.getElementById('payBox');
      const comingBack = new URLSearchParams(window.location.search).get('back') === '1';   // returning from the HitPay page
      let online = false;                                                                  // is real PayNow switched on at the server?

      // Real PayNow: ask the server for the HitPay page, then go there. The server (not this page) marks the booking paid.
      async function payOnline(kind, button, label) {
        button.disabled = true; button.textContent = 'Opening PayNow...';
        try {
          const started = await api.post('/pay/start', { code: code, kind: kind });
          window.location.href = started.url;
        } catch (e) {
          await uiAlert((e && e.message) || 'We could not start the payment. Please try again.');
          button.disabled = false; button.textContent = label;
        }
      }

      // After HitPay sends the guest back, wait for the payment to be confirmed (up to about 40 seconds)
      async function confirmPayment(kind) {
        box.innerHTML = '';
        const h = document.createElement('h1'); h.textContent = 'Payment';
        box.appendChild(h);
        notice('Confirming your payment with PayNow... this can take a few seconds. Please keep this page open.', '');
        for (let i = 0; i < 14; i++) {
          try {
            const st = await api.get('/pay/status?code=' + encodeURIComponent(code) + '&kind=' + kind);
            if (st.paid) { await refreshData(); history.replaceState(null, '', 'pay.html?code=' + encodeURIComponent(code)); render(); return; }
          } catch (e) { /* try again */ }
          await new Promise(function (ok) { setTimeout(ok, 3000); });
        }
        box.innerHTML = '';
        box.appendChild(h);
        notice('We have not received the payment yet. If you paid, it can take a minute to appear. Press the button to check again. If you did not finish paying, you can start again.', 'warn');
        const again = document.createElement('button');
        again.textContent = 'Check again';
        again.addEventListener('click', function () { confirmPayment(kind); });
        box.appendChild(again);
        box.appendChild(document.createTextNode(' '));
        backLink();
      }

      function line(label, value) {
        const p = document.createElement('p');
        const strong = document.createElement('strong');
        strong.textContent = label + ': ';
        p.appendChild(strong);
        p.appendChild(document.createTextNode(value));
        box.appendChild(p);
      }
      function notice(text, kind) {
        const div = document.createElement('div');
        div.className = 'notice ' + (kind || '');
        div.textContent = text;
        box.appendChild(div);
      }
      function backLink() {
        const a = document.createElement('a');
        a.className = 'cta';
        a.href = 'sessions.html';
        a.textContent = 'Back to my sessions';
        box.appendChild(a);
      }

      // PayNow or Card; the method saved in Settings is chosen first
      function methodChoice() {
        if (online) { notice('Pay with PayNow: you will be taken to a secure page that shows a PayNow QR code. Scan it with your banking app.', ''); return; }
        const saved = (user.savedPayment && user.savedPayment.method) || 'PayNow';
        const methods = document.createElement('div');
        methods.className = 'pay-methods';
        [['PayNow', 'PayNow'], ['Card', 'Card (practice)' + (user.savedPayment && user.savedPayment.method === 'Card' ? ' ending ' + user.savedPayment.last4 : '')]].forEach(function (m) {
          const label = document.createElement('label');
          const radio = document.createElement('input');
          radio.type = 'radio'; radio.name = 'method'; radio.value = m[0]; radio.checked = m[0] === saved;
          label.appendChild(radio);
          label.appendChild(document.createTextNode(m[1]));
          methods.appendChild(label);
        });
        box.appendChild(methods);
      }

      function render() {
        box.innerHTML = '';
        const r = loadReservations().find(x => x.code === code && (x.email || '').toLowerCase() === user.email);
        const title = document.createElement('h1');
        title.textContent = 'Payment';
        box.appendChild(title);

        if (!r) { notice('We could not find that booking in your account.', 'warn'); backLink(); return; }

        line('Booking', r.code);
        line('Session', r.session);
        line('Room', r.zone || r.roomName || '-');
        line('Date and time', formatDate(r.date) + ', ' + timeRange(r) + ' (' + hoursText(bookingHours(r)) + ')');
        line('Guests', r.guests);
        if ((r.cats || []).length) line('Cats', catNamesOf(r).join(', '));
        if (r.handler) line('Cat handler', r.handler);
        const perHour = r.pricePerHour !== undefined ? r.pricePerHour : amountOf(r) / bookingHours(r);
        line('Amount', money(amountOf(r)) + ' (' + money(perHour) + ' per hour x ' + hoursText(bookingHours(r)) + ', the same for any number of guests)');

        if (r.status === 'Cancelled') {
          const why = r.cancelledBy === 'system' ? 'This booking was cancelled because it was not paid in time. Nothing was charged.'
                    : 'This booking was cancelled.' + (r.paid ? ' Refund: ' + money(r.refund) + ' (' + r.refundPercent + '%).' : '');
          notice(why, 'warn');
          if (r.cancelFee > 0) {
            if (r.feePaid) {
              line('Cancellation fee', money(r.cancelFee) + (r.paid ? ' (kept from your payment)' : ' (paid, ' + (r.feePayment ? r.feePayment.ref : '') + ')'));
            } else {
              line('Cancellation fee due', money(r.cancelFee));
              methodChoice();
              const payFee = document.createElement('button');
              payFee.textContent = 'Pay fee ' + money(r.cancelFee);
              payFee.addEventListener('click', async function () {
                if (online) { payOnline('fee', payFee, 'Pay fee ' + money(r.cancelFee)); return; }
                payFee.disabled = true; payFee.textContent = 'Processing...';
                const done = await payCancellationFee(r.code, box.querySelector('input[name=method]:checked').value);
                if (!done.ok) { await uiAlert(done.error); payFee.disabled = false; payFee.textContent = 'Pay fee ' + money(r.cancelFee); return; }
                render();
              });
              box.appendChild(payFee);
              box.appendChild(document.createTextNode(' '));
            }
          }
          backLink();
          return;
        }
        if (r.paid) {
          const rec = document.createElement('div');
          rec.className = 'receipt';
          rec.innerHTML = '<strong>Paid. Thank you!</strong>';
          const info = document.createElement('p');
          info.textContent = 'Receipt ' + r.payment.ref + ' | ' + (r.payment.method === 'Card' ? 'Card (practice)' : r.payment.method) + ' | ' + money(r.payment.amount);
          rec.appendChild(info);
          box.appendChild(rec);
          backLink();
          return;
        }
        if (r.status === 'Concluded') { notice('This session has finished.'); backLink(); return; }
        if (r.status !== 'Assigned') { notice('This booking cannot be paid yet.'); backLink(); return; }

        if (!online) notice('PRACTICE ONLY: no money is taken and no card details are asked for. The real site would send you to a secure payment provider.', 'warn');

        if (r.payBy) notice('Please pay by ' + new Date(r.payBy).toLocaleString('en-SG', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) + '. An unpaid booking is cancelled automatically after that, and the room and cats are freed for other guests.', '');
        methodChoice();

        const pay = document.createElement('button');
        pay.id = 'payBtn';
        pay.textContent = 'Pay ' + money(amountOf(r)) + ' now';
        pay.addEventListener('click', async function () {
          if (online) { payOnline('booking', pay, 'Pay ' + money(amountOf(r)) + ' now'); return; }
          const method = box.querySelector('input[name=method]:checked').value;
          pay.disabled = true; pay.textContent = 'Processing...';      // stop double clicks
          const done = await payReservation(r.code, method);
          if (!done.ok) { await uiAlert(done.error); pay.disabled = false; pay.textContent = 'Pay ' + money(amountOf(r)) + ' now'; return; }
          render();
        });
        box.appendChild(pay);
        box.appendChild(document.createTextNode(' '));
        backLink();
      }
      (async function start() {
        try { online = !!(await api.get('/pay/config')).online; } catch (e) { online = false; }
        const mine = loadReservations().find(x => x.code === code && (x.email || '').toLowerCase() === user.email);
        if (online && comingBack && mine && ((mine.status === 'Assigned' && !mine.paid) || (mine.status === 'Cancelled' && mine.cancelFee > 0 && !mine.feePaid))) {
          confirmPayment(mine.status === 'Cancelled' ? 'fee' : 'booking');
        } else render();
      })();
    }
    });
  </script>
</body>
</html>
