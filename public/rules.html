<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Café Reservations - Cafe rules</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <div class="layout">
    <nav id="side-nav" class="side-nav"></nav>

    <main>
      <h1>Cafe rules</h1>
      <p>Please help us keep our cats happy and everyone safe.</p>
      <div class="card wide-card"><ol id="ruleList"></ol></div>
      <p><a href="terms.html">Terms and conditions</a> &nbsp;|&nbsp; <a href="faq.html">FAQ</a></p>
    </main>
  </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="storage.js"></script>
  <script src="data.js"></script>
  <script src="bookings.js"></script>
  <script src="actions.js"></script>
  <script src="layout.js"></script>
  <script>

    onDataReady(async function () {
    renderLayout('rules.html');
    [
      'Wash or sanitise your hands before and after you touch the cats.',
      'Let the cats come to you. Never chase, grab, pick up or wake a cat.',
      'Pet gently on the back and shoulders. Please do not touch the tummy, tail or paws.',
      'No flash photography, and no loud noises or sudden movements.',
      'Do not feed the cats. Only our handlers give them treats.',
      'No outside food or drink in the cat rooms. Order from our menu instead.',
      'Children must be with an adult at all times, and must be gentle.',
      'If a cat walks away, or hisses or scratches, give it space and tell your handler.',
      'Follow your cat handler\'s instructions. They can end a session if a cat or person is at risk.',
      'Please arrive on time. Your hours include everything, and the next guest starts after you.',
      'Tell us about allergies, including cat allergies, before you book.'
    ].forEach(function (rule) {
      const li = document.createElement('li');
      li.textContent = rule;
      li.style.margin = '6px 0';
      document.getElementById('ruleList').appendChild(li);
    });
    });
  </script>
</body>
</html>
