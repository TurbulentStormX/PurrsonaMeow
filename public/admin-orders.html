
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Purrsona Meow | Admin Orders</title>

  <!-- Existing project styles -->
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="pages.css">

  <link rel="stylesheet" href="admin-design.css">

  <link rel="stylesheet" href="admin-orders-design.css">
</head>

<body>

  <!-- Shared header -->
  <header
    id="site-header"
    class="site-header">
  </header>

  <div class="layout">

    <!-- Shared sidebar -->
    <nav
      id="side-nav"
      class="side-nav">
    </nav>

    <!-- ADMIN ORDERS PAGE -->
    <main class="admin-page admin-orders-page">

      <div class="card wide-card orders-card">

        <!-- PAGE HEADING -->
        <div class="orders-heading">

          <span class="orders-eyebrow">
            PURRSONA MEOW · ADMIN PANEL
          </span>

          <h1>Food &amp; Drink Orders</h1>

          <p class="orders-description">
            View customer orders, monitor their
            status and mark orders as served.
          </p>

        </div>

        <!-- ORDER SUMMARY -->
        <section
          class="orders-summary-section"
          aria-label="Order summary">

          <h2>Order Overview</h2>

          <div
            class="summary orders-summary"
            id="summary">
          </div>

        </section>

        <!-- ORDERS TABLE -->
        <section class="orders-table-section">

          <div class="orders-section-heading">
            <h2>All Orders</h2>

            <p>
              Manage food and drink orders
              for customer reservations.
            </p>
          </div>

          <div class="table-scroll orders-table-scroll">

            <table class="orders-table">

              <thead>
                <tr>
                  <th scope="col">Order</th>
                  <th scope="col">Reservation</th>
                  <th scope="col">Guest</th>
                  <th scope="col">Room</th>
                  <th scope="col">Handler</th>
                  <th scope="col">Items</th>
                  <th scope="col">Total</th>
                  <th scope="col">Status</th>
                  <th scope="col">Action</th>
                </tr>
              </thead>

              <tbody id="rows"></tbody>

            </table>

          </div>

        </section>

      </div>

    </main>

  </div>

  <!-- Shared footer -->
  <footer
    id="site-footer"
    class="site-footer">
  </footer>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="storage.js"></script>
  <script src="data.js"></script>
  <script src="bookings.js"></script>
  <script src="actions.js"></script>
  <script src="layout.js"></script>

  <script>

    onDataReady(async function () {
    renderLayout('admin-orders.html');

    if (guardPage(['admin'], 'see orders')) {
      initOrders();
    }

    function initOrders() {

      function render() {

        const orders = loadOrders();
        const reservations = loadReservations();

        const body = document.getElementById('rows');
        body.innerHTML = '';

        orders.forEach(function (o) {

          const res = reservations.find(
            r => r.code === o.reservation
          );

          const tr = body.insertRow();

          [
            o.code,
            o.reservation,
            res ? res.name : '-',
            o.zone,
            o.handler || '-',
            orderItemsText(o),
            money(o.total)
          ].forEach(function (v) {

            tr.insertCell().textContent = v;

          });

          // ORDER STATUS
          const statusCell = tr.insertCell();

          const pill = document.createElement('span');

          pill.className =
            'status-pill status-' + o.status;

          pill.textContent = o.status;

          statusCell.appendChild(pill);

          // ORDER ACTION
          const action = tr.insertCell();

          if (o.status === 'Ordered') {

            const btn = document.createElement('button');

            btn.textContent = 'Mark served';
            btn.addEventListener('click', async function () {
              const done = await markOrderServed(o.code);
              if (!done.ok) alert(done.error);
              render();

            });

            action.appendChild(btn);

          } else {

            action.textContent = '-';

          }

        });

        // ORDER SUMMARY
        const served = orders.filter(
          o => o.status === 'Served'
        );

        document.getElementById('summary').textContent =
          'Ordered: ' +
          orders.filter(
            o => o.status === 'Ordered'
          ).length +

          '   Served: ' +
          served.length +

          '   Sales (served): ' +
          money(
            served.reduce(
              (sum, o) => sum + o.total,
              0
            )
          );

      }

      render();

    }
    });
  </script>

</body>
</html>
