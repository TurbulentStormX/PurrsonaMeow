<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purrsona Meow - Settings</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="settings-design.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <div class="layout">
    <nav id="side-nav" class="side-nav"></nav>

    <main class="settings-page">
      <div class="settings-container" id="settingsRoot">
        <section class="settings-heading">
          <span class="settings-eyebrow">PURRSONA MEOW</span>
          <h1>Settings</h1>
          <p id="settingsIntro">Manage your account.</p>
        </section>
        <div class="settings-tabs" id="settingsTabs"></div>
        <div id="settingsBody"></div>
      </div>
    </main>
  </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="storage.js"></script>
  <script src="data.js"></script>
  <script src="bookings.js"></script>
  <script src="actions.js"></script>
  <script src="layout.js"></script>
  <script>
    onDataReady(async function () {
      renderLayout('settings.html');
      if (guardPage(['guest', 'handler', 'admin'], 'change your settings')) initSettings();

      function initSettings() {
        let user = currentUser();
        const isGuest = user.role === 'guest';
        const body = document.getElementById('settingsBody');
        const tabsBox = document.getElementById('settingsTabs');
        const TABS = isGuest ? [['account', 'Account'], ['payment', 'Payment'], ['subscription', 'Subscription']] : [['account', 'Account']];
        document.getElementById('settingsIntro').textContent = isGuest
          ? 'Your account, your payments and your subscription.'
          : 'Your own details and the picture shown in the top bar.';
        let tab = (window.location.hash || '#account').slice(1);
        if (!TABS.some(t => t[0] === tab)) tab = 'account';

        const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
        function say(target, text, good) { target.className = 'settings-msg ' + (good ? 'good' : 'bad'); target.textContent = text; }
        function field(label, input) { const l = document.createElement('label'); l.append(label, input); return l; }
        function card(title, hint) { const c = el('section', 'settings-card'); c.appendChild(el('h2', '', title)); if (hint) c.appendChild(el('p', 'hint', hint)); return c; }
        function input(type, value, attrs) { const i = document.createElement('input'); i.type = type; i.value = value || ''; Object.assign(i, attrs || {}); return i; }
        function userChanged(next) { user = next; updateStoredUser(next); renderHeaderAvatar(); }
        function renderHeaderAvatar() {                                      // refresh the round picture in the top bar
          const btn = document.getElementById('avatarBtn');
          if (btn) { btn.innerHTML = ''; btn.appendChild(avatarElement(user)); btn.title = user.name; }
        }

        // ---------- Account: avatar, name, phone, password ----------
        function accountTab() {
          const frag = document.createDocumentFragment();

          const pic = card('Profile picture', 'Pick an icon and a colour. Until you pick one, your initials are shown.');
          const editor = el('div', 'avatar-editor');
          let draft = { icon: (user.avatar && user.avatar.icon) || '', color: (user.avatar && user.avatar.color) || AVATAR_COLORS[0] };
          const preview = el('div');
          function drawPreview() { preview.innerHTML = ''; preview.appendChild(avatarElement({ name: user.name, avatar: draft }, 'big')); }
          const picks = el('div', 'avatar-picks');
          const iconGrid = el('div', 'icon-grid');
          const colorGrid = el('div', 'color-grid');
          function drawPicks() {
            iconGrid.innerHTML = ''; colorGrid.innerHTML = '';
            const none = el('button', draft.icon === '' ? 'chosen' : '', 'Aa');
            none.type = 'button'; none.title = 'Initials'; none.style.fontSize = '15px'; none.style.fontWeight = '700';
            none.addEventListener('click', () => { draft.icon = ''; drawPicks(); drawPreview(); });
            iconGrid.appendChild(none);
            Object.keys(AVATAR_ICONS).forEach(function (name) {
              const b = el('button', draft.icon === name ? 'chosen' : '', AVATAR_ICONS[name]);
              b.type = 'button'; b.title = name; b.setAttribute('aria-label', 'Icon ' + name);
              b.addEventListener('click', () => { draft.icon = name; drawPicks(); drawPreview(); });
              iconGrid.appendChild(b);
            });
            AVATAR_COLORS.forEach(function (c) {
              const b = el('button', draft.color === c ? 'chosen' : '');
              b.type = 'button'; b.style.background = c; b.setAttribute('aria-label', 'Colour ' + c);
              b.addEventListener('click', () => { draft.color = c; drawPicks(); drawPreview(); });
              colorGrid.appendChild(b);
            });
          }
          picks.append(el('strong', '', 'Icon'), iconGrid, el('strong', '', 'Colour'), colorGrid);
          editor.append(preview, picks);
          pic.appendChild(editor);
          const picMsg = el('div');
          const save = el('button', 'primary', 'Save picture');
          save.type = 'button';
          save.addEventListener('click', async function () {
            try { const out = await api.put('/auth/avatar', draft); userChanged(out.user); say(picMsg, 'Picture saved.', true); }
            catch (e) { say(picMsg, errorText(e), false); }
          });
          pic.append(save, picMsg);
          drawPicks(); drawPreview();
          frag.appendChild(pic);

          const prof = card('Your details', isGuest ? 'Your email is your login, so it cannot be changed here.' : 'Your username is your login, so it cannot be changed here.');
          const name = input('text', user.name, { maxLength: 80, id: 'setName' });
          prof.appendChild(field('Name', name));
          prof.appendChild(field(isGuest ? 'Email' : 'Username', input('text', isGuest ? user.email : user.username, { readOnly: true })));
          let phone = null;
          if (isGuest) { phone = input('tel', user.phone, { maxLength: 8, id: 'setPhone' }); prof.appendChild(field('Phone (8 digits, starts with 6, 8 or 9)', phone)); }
          const profMsg = el('div');
          const saveProf = el('button', 'primary', 'Save details');
          saveProf.type = 'button';
          saveProf.addEventListener('click', async function () {
            try {
              const out = await api.put('/auth/profile', isGuest ? { name: name.value, phone: phone.value } : { name: name.value });
              userChanged(out.user); say(profMsg, 'Details saved.', true);
            } catch (e) { say(profMsg, errorText(e), false); }
          });
          prof.append(saveProf, profMsg);
          frag.appendChild(prof);

          const pw = card('Change password', 'Enter your current password, then a new one.');
          const cur = input('password', '', { id: 'setCurrent', autocomplete: 'current-password' });
          const nw = input('password', '', { id: 'setNew', autocomplete: 'new-password' });
          const again = input('password', '', { id: 'setAgain', autocomplete: 'new-password' });
          pw.append(field('Current password', cur), field('New password', nw));
          const rules = el('ul', 'pw-rules');
          pw.appendChild(rules);
          showPasswordChecklist(nw, rules);
          pw.appendChild(field('New password again', again));
          const pwMsg = el('div');
          const savePw = el('button', 'primary', 'Change password');
          savePw.type = 'button';
          savePw.addEventListener('click', async function () {
            if (nw.value !== again.value) { say(pwMsg, 'The two new passwords are not the same.', false); return; }
            try {
              await api.post('/auth/password', { current: cur.value, password: nw.value });
              cur.value = nw.value = again.value = '';
              say(pwMsg, 'Password changed. Use it the next time you log in.', true);
            } catch (e) { say(pwMsg, errorText(e), false); }
          });
          pw.append(savePw, pwMsg);
          frag.appendChild(pw);
          return frag;
        }

        // ---------- Payment: saved method, fees due, history ----------
        function myBookings() { return loadReservations().filter(r => (r.email || '').toLowerCase() === (user.email || '').toLowerCase()); }
        function historyRows() {
          const rows = [];
          myBookings().forEach(function (r) {
            if (r.paid && r.payment) rows.push({ when: r.payment.paidAt, type: 'Payment', code: r.code, method: r.payment.method, amount: -r.payment.amount });
            if (r.status === 'Cancelled' && r.paid && r.refund > 0) rows.push({ when: r.cancelledAt, type: 'Refund', code: r.code, method: r.payment ? r.payment.method : '', amount: r.refund });
            if (r.status === 'Cancelled' && r.paid && r.cancelFee > 0) rows.push({ when: r.cancelledAt, type: 'Cancellation fee (kept from payment)', code: r.code, method: '', amount: 0, note: money(r.cancelFee) });
            if (r.feePayment) rows.push({ when: r.feePayment.paidAt, type: 'Cancellation fee paid', code: r.code, method: r.feePayment.method, amount: -r.feePayment.amount });
          });
          return rows.sort((a, b) => String(b.when).localeCompare(String(a.when)));
        }
        function paymentTab() {
          const frag = document.createDocumentFragment();

          const saved = card('Saved payment method', 'PRACTICE ONLY. No real money is taken. This is chosen first when you pay. For a card we only keep the last 4 digits.');
          const cur = user.savedPayment || { method: '', last4: '' };
          const choices = el('div', 'pay-choices');
          const mk = (value, label) => { const l = el('label'); const r = input('radio', value, { name: 'savedMethod', checked: cur.method === value }); l.append(r, document.createTextNode(label)); choices.appendChild(l); return r; };
          mk('PayNow', 'PayNow');
          mk('Card', 'Card (practice)');
          saved.appendChild(choices);
          const last4 = input('text', cur.last4, { maxLength: 4, id: 'setLast4', placeholder: 'Last 4 digits' });
          const last4Label = field('Card: last 4 digits', last4);
          last4Label.style.display = cur.method === 'Card' ? 'block' : 'none';
          saved.appendChild(last4Label);
          choices.addEventListener('change', () => { last4Label.style.display = saved.querySelector('input[name=savedMethod]:checked').value === 'Card' ? 'block' : 'none'; });
          const msg = el('div');
          const saveBtn = el('button', 'primary', 'Save method');
          saveBtn.type = 'button';
          saveBtn.addEventListener('click', async function () {
            const chosen = saved.querySelector('input[name=savedMethod]:checked');
            if (!chosen) { say(msg, 'Please choose PayNow or Card.', false); return; }
            try { const out = await api.put('/auth/payment-method', { method: chosen.value, last4: last4.value.trim() }); userChanged(out.user); say(msg, 'Saved. This is now your default when paying.', true); }
            catch (e) { say(msg, errorText(e), false); }
          });
          const clearBtn = el('button', 'link', 'Remove saved method');
          clearBtn.type = 'button';
          clearBtn.addEventListener('click', async function () {
            try { const out = await api.put('/auth/payment-method', { method: '' }); userChanged(out.user); render(); }
            catch (e) { say(msg, errorText(e), false); }
          });
          saved.append(saveBtn, clearBtn, msg);
          frag.appendChild(saved);

          const owed = myBookings().filter(r => r.status === 'Cancelled' && r.cancelFee > 0 && !r.feePaid);
          const unpaid = myBookings().filter(r => r.status === 'Assigned' && !r.paid);
          const due = card('To pay', 'Cancellation fees you owe, and bookings waiting for payment.');
          if (!owed.length && !unpaid.length) due.appendChild(el('p', 'hint', 'Nothing to pay. Thank you!'));
          owed.forEach(function (r) {
            const box = el('div', 'fee-due');
            box.appendChild(el('p', '', 'Cancellation fee ' + money(r.cancelFee) + ' for booking ' + r.code + ' (' + r.session + ', ' + formatDate(r.date) + ').'));
            const a = el('a', 'cta', 'Pay fee'); a.href = 'pay.html?code=' + encodeURIComponent(r.code);
            box.appendChild(a); due.appendChild(box);
          });
          unpaid.forEach(function (r) {
            const box = el('div', 'fee-due');
            box.appendChild(el('p', '', 'Booking ' + r.code + ' (' + r.session + ', ' + formatDate(r.date) + ') is unpaid: ' + money(amountOf(r)) + '.' + (r.payBy ? ' Pay by ' + new Date(r.payBy).toLocaleString('en-SG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) + ' or it is cancelled.' : '')));
            const a = el('a', 'cta', 'Pay now'); a.href = 'pay.html?code=' + encodeURIComponent(r.code);
            box.appendChild(a); due.appendChild(box);
          });
          frag.appendChild(due);

          const hist = card('Payment history', 'Payments, refunds and cancellation fees.');
          const rows = historyRows();
          if (!rows.length) hist.appendChild(el('p', 'hint', 'No payments yet.'));
          else {
            const wrap = el('div', 'settings-table-wrap');
            const table = document.createElement('table');
            table.innerHTML = '<thead><tr><th>Date</th><th>What</th><th>Booking</th><th>Method</th><th>Amount</th></tr></thead>';
            const tb = document.createElement('tbody');
            rows.forEach(function (row) {
              const tr = tb.insertRow();
              tr.insertCell().textContent = row.when ? new Date(row.when).toLocaleString('en-SG', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '-';
              tr.insertCell().textContent = row.type;
              tr.insertCell().textContent = row.code;
              tr.insertCell().textContent = row.method === 'Card' ? 'Card (practice)' : (row.method || '-');
              const amt = tr.insertCell();
              amt.textContent = row.note ? row.note : (row.amount < 0 ? '- ' + money(-row.amount) : '+ ' + money(row.amount));
              amt.className = row.note ? '' : row.amount < 0 ? 'minus' : 'plus';
            });
            table.appendChild(tb); wrap.appendChild(table); hist.appendChild(wrap);
          }
          frag.appendChild(hist);
          return frag;
        }

        // ---------- Subscription ----------
        function subscriptionTab() {
          const frag = document.createDocumentFragment();
          const mine = loadSubscriptions().filter(s => s.email === (user.email || '').toLowerCase());
          const active = mine.find(s => s.status === 'active');
          const c = card('Support us plan', 'Your monthly plan that helps care for the cats (practice only, no real payment).');
          if (active) {
            const tier = SUPPORT_TIERS.find(t => t.id === active.tier);
            c.appendChild(el('p', '', (tier ? tier.name : active.tier) + ' - ' + money(active.price) + ' per month, since ' + formatDate(String(active.startedAt).slice(0, 10)) + '.'));
            const msg = el('div');
            const cancel = el('button', 'primary', 'Cancel my plan');
            cancel.type = 'button';
            cancel.addEventListener('click', async function () {
              if (!confirm('Cancel your plan?')) return;
              const done = await cancelSubscription();
              if (!done.ok) { say(msg, done.error, false); return; }
              render();
            });
            const change = el('a', 'cta', 'Change plan'); change.href = 'support.html'; change.style.marginLeft = '10px';
            c.append(cancel, change, msg);
          } else {
            c.appendChild(el('p', '', 'You do not have a plan right now.'));
            const a = el('a', 'cta', 'See the plans'); a.href = 'support.html';
            c.appendChild(a);
          }
          frag.appendChild(c);
          const past = mine.filter(s => s.status !== 'active');
          if (past.length) {
            const h = card('Earlier plans');
            const ul = el('ul', 'pw-rules');
            past.forEach(s => ul.appendChild(el('li', '', s.tier + ' - ' + money(s.price) + ', ' + formatDate(String(s.startedAt).slice(0, 10)) + ' to ' + (s.cancelledAt ? formatDate(String(s.cancelledAt).slice(0, 10)) : '-'))));
            h.appendChild(ul);
            frag.appendChild(h);
          }
          return frag;
        }

        function render() {
          tabsBox.innerHTML = '';
          if (TABS.length > 1) TABS.forEach(function (t) {
            const b = el('button', t[0] === tab ? 'active' : '', t[1]);
            b.type = 'button';
            b.addEventListener('click', function () { tab = t[0]; history.replaceState(null, '', '#' + tab); render(); });
            tabsBox.appendChild(b);
          });
          body.innerHTML = '';
          body.appendChild(tab === 'payment' ? paymentTab() : tab === 'subscription' ? subscriptionTab() : accountTab());
          addPasswordToggles();
        }
        render();
      }
    });
  </script>
</body>
</html>
