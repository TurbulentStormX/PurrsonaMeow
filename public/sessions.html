<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Café Reservations - Sessions</title>
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="sessions-design.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <div class="layout">
    <nav id="side-nav" class="side-nav"></nav>

    
<main class="sessions-page">
  <div class="sessions-container">

    <section class="sessions-heading">
      <span class="sessions-eyebrow">PURRSONA MEOW</span>
      <h1>My Sessions</h1>
      <p>
        Keep track of your bookings, check your upcoming
        visits, and enjoy every moment with our furry friends.
      </p>
    </section>

    <section class="sessions-card lookup-card" id="lookupCard">
      <div class="sessions-section-heading">
        <h2>Check Your Booking</h2>
        <p>
          Have a booking code? Enter it below to check
          your reservation status. No login required.
        </p>
      </div>

      <div class="lookup-form">
        <label for="lookupCode">Booking Code</label>

        <div class="lookup-controls">
          <input
            type="text"
            id="lookupCode"
            placeholder="CC-XXXXX"
            autocomplete="off"
          >

          <button type="button" id="lookupBtn">
            Check Booking
          </button>
        </div>
      </div>

      <div id="lookupResult"></div>
    </section>

    <section class="sessions-card bookings-card" id="myReservations"></section>

    <section class="sessions-card orders-card" id="myOrders"></section>

  </div>
</main>

  </div>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="storage.js"></script>
  <script src="data.js"></script>
  <script src="bookings.js"></script>
  <script src="actions.js"></script>
  <script src="layout.js"></script>
  <script>

    onDataReady(async function () {
    renderLayout('sessions.html');
    const user = currentUser();
    // Visitors and guests can use this page. Staff have their own pages.
    if (!user || user.role === 'guest' || guardPage(['guest'], 'see your sessions')) initSessions();

    function initSessions() {
      const isGuest = !!user && user.role === 'guest';

      // ----- check a booking with its code (works without logging in) -----
      // The server answers with non-personal details only, and locks the box after too many wrong codes.
      document.getElementById('lookupBtn').addEventListener('click', async function () {
        const out = document.getElementById('lookupResult');
        out.innerHTML = '';
        const code = document.getElementById('lookupCode').value.trim();
        function problem(text) {
          const div = document.createElement('div');
          div.className = 'msg-error';
          div.textContent = text;
          out.appendChild(div);
        }
        if (!code) { problem('Please type your booking code.'); return; }
        let found;
        try {
          found = await api.get('/reservations/' + encodeURIComponent(code));
        } catch (e) {
          problem(errorText(e));
          return;
        }
        const box = document.createElement('div');
        box.className = 'result-box';
        const rows = [['Booking code', found.code], ['Session', found.session], ['Room', found.room],
                      ['Date and time', formatDate(found.date) + ', ' + timeRange({ time: found.time, hours: found.hours }) + ' (' + hoursText(found.hours) + ')'],
                      ['Guests', found.guests]];
        if ((found.cats || []).length) rows.push(['Cats', found.cats.join(', ')]);
        if (found.handler) rows.push(['Cat Handler', handlerContact(found.handler)]);
        rows.forEach(function (row) {
          const p = document.createElement('p');
          const label = document.createElement('strong');
          label.textContent = row[0] + ': ';
          p.appendChild(label);
          p.appendChild(document.createTextNode(row[1]));
          box.appendChild(p);
        });
        const status = document.createElement('p');
        const statusLabel = document.createElement('strong');
        statusLabel.textContent = 'Status: ';
        status.appendChild(statusLabel);
        status.appendChild(statusPill(found.status));
        box.appendChild(status);
        out.appendChild(box);
      });

      // ----- guests can cancel until the session starts. The room and cats are free for others straight away. -----
      async function cancelBooking(r) {
        const percent = refundPercentFor(r.date, r.time);
        const price = amountOf(r);
        const fee = Math.round(price * (100 - percent)) / 100;
        let message = 'Cancel booking ' + r.code + '?\n\n' + r.session + ', ' + formatDate(r.date) + ', ' + timeRange(r) + '.';
        if (fee === 0) message += '\n\nThere is no cancellation fee. ' + (r.paid ? 'You get all ' + money(price) + ' back.' : 'You have not paid, so nothing is charged.');
        else if (r.paid) message += '\n\nCancellation fee: ' + money(fee) + ' (' + (100 - percent) + '% of the price). You paid ' + money(price) + ', so you get ' + money(price - fee) + ' back.';
        else message += '\n\nCancellation fee: ' + money(fee) + ' (' + (100 - percent) + '% of the price). You have not paid yet, so the fee will be due. You can pay it on the next screen or later in Settings.';
        message += '\n\nYour room and cat(s) become free for other guests.';
        if (!confirm(message)) return;

        const done = await cancelReservation(r.code);
        if (!done.ok) { alert(done.error); return; }
        if (done.feeDue > 0) {
          if (confirm('Cancelled. You owe a cancellation fee of ' + money(done.feeDue) + '. Pay it now?')) { window.location.href = 'pay.html?code=' + encodeURIComponent(r.code); return; }
        } else {
          alert(r.paid ? 'Cancelled. Refund: ' + money(done.refund) + (done.fee ? ' (cancellation fee ' + money(done.fee) + ' kept).' : '.') : 'Cancelled.');
        }
        render();
      }

      function render() {
        const box = document.getElementById('myReservations');
        const ordersBox = document.getElementById('myOrders');
        box.innerHTML = '';
        ordersBox.innerHTML = '';

        if (!isGuest) {
          ordersBox.style.display = 'none';
          box.className = 'card';
          box.innerHTML = '<h2>Want to book or order food?</h2><p>Log in or create a free account to book sessions, see all your bookings and order drinks and snacks for your room.</p>' +
            '<a class="cta" href="login.html">Log in</a> &nbsp; <a class="cta" href="signup.html">Sign up</a>';
          return;
        }

        box.innerHTML = '<h2>My bookings</h2>';
        const mine = loadReservations().filter(r => (r.email || '').toLowerCase() === user.email);
        if (mine.length === 0) {
          const none = document.createElement('p');
          none.innerHTML = 'You have no bookings yet. <a href="booking.html">Book a session</a>.';
          box.appendChild(none);
        } else {
          const wrap = document.createElement('div');
          wrap.className = 'table-scroll';
          const table = document.createElement('table');
          table.innerHTML = '<tr><th>Code</th><th>Session</th><th>Date</th><th>Time</th><th>Guests</th><th>Cats</th><th>Total</th><th>Status</th><th>Payment</th><th>Room</th><th>Cat Handler</th><th></th></tr>';
          mine.forEach(function (r) {
            const row = table.insertRow();
            [r.code, r.session, r.date, timeRange(r) + ' (' + hoursText(bookingHours(r)) + ')', r.guests].forEach(v => { row.insertCell().textContent = v; });
            const catCell = row.insertCell();
            catCell.textContent = (r.cats || []).length ? catNamesOf(r).join(', ') : '-';
            if (r.changeNote && r.status === 'Assigned') {
              const note = document.createElement('div');
              note.className = 'flag';
              note.textContent = r.changeNote;
              catCell.appendChild(note);
            }
            row.insertCell().textContent = money(amountOf(r));
            const statusCell = row.insertCell();
            statusCell.appendChild(statusPill(r.status));
            if (r.needsAttention && (r.status === 'Assigned' || r.status === 'Requested')) {
              const note = document.createElement('div');
              note.className = 'flag';
              note.textContent = 'We are sorting something out and will contact you.';
              statusCell.appendChild(note);
            }
            const payCell = row.insertCell();
            payCell.appendChild(paymentPill(r));
            if (r.status === 'Cancelled' && r.paid) payCell.appendChild(document.createTextNode(' ' + money(r.refund)));
            if (r.status === 'Cancelled' && r.cancelledBy === 'system') {
              const note = document.createElement('div');
              note.className = 'flag';
              note.textContent = 'Cancelled automatically: not paid in time.';
              payCell.appendChild(note);
            }
            if (r.status === 'Cancelled' && r.cancelFee > 0) {
              const note = document.createElement('div');
              note.className = 'flag';
              note.textContent = 'Cancellation fee ' + money(r.cancelFee) + (r.feePaid ? ' (paid)' : ' (due)');
              payCell.appendChild(note);
            }
            if (r.status === 'Assigned' && !r.paid && r.payBy) {
              const note = document.createElement('div');
              note.className = 'flag';
              note.textContent = 'Pay by ' + new Date(r.payBy).toLocaleString('en-SG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) + ' or it is cancelled.';
              payCell.appendChild(note);
            }
            row.insertCell().textContent = r.zone || r.roomName || '-';
            row.insertCell().textContent = r.handler ? handlerContact(r.handler) : '-';

            const action = row.insertCell();
            action.className = 'nowrap';
            if (r.status === 'Assigned' && !r.paid) {
              const pay = document.createElement('a');
              pay.className = 'cta';
              pay.href = 'pay.html?code=' + encodeURIComponent(r.code);
              pay.textContent = 'Pay now';
              pay.style.marginRight = '6px';
              action.appendChild(pay);
            }
            if (r.status === 'Assigned') {
              const food = document.createElement('a');
              food.href = 'menu.html';
              food.textContent = 'Order food';
              food.style.marginRight = '6px';
              action.appendChild(food);
            }
            if (r.status === 'Cancelled' && r.cancelFee > 0 && !r.feePaid) {
              const payFee = document.createElement('a');
              payFee.className = 'cta';
              payFee.href = 'pay.html?code=' + encodeURIComponent(r.code);
              payFee.textContent = 'Pay fee';
              action.appendChild(payFee);
            }
            if (r.status === 'Requested' || r.status === 'Assigned') {
              const btn = document.createElement('button');
              btn.textContent = 'Cancel';
              btn.addEventListener('click', () => cancelBooking(r));
              action.appendChild(btn);
            }
            if (r.status === 'Concluded') {
              if (canReview(r)) {
                const rate = document.createElement('a');
                rate.className = 'cta';
                rate.href = 'review.html?code=' + encodeURIComponent(r.code);
                rate.textContent = 'Review your session';
                action.appendChild(rate);
              } else {
                action.appendChild(document.createTextNode('Reviewed, thank you'));
              }
            }
          });
          wrap.appendChild(table);
          box.appendChild(wrap);
        }

        ordersBox.innerHTML = '<h2>My orders</h2>';
        const orders = loadOrders().filter(o => o.email === user.email);
        if (orders.length === 0) {
          const none = document.createElement('p');
          none.innerHTML = 'No orders yet. Once your booking is confirmed, you can order from the <a href="menu.html">Menu</a>.';
          ordersBox.appendChild(none);
        } else {
          const table = document.createElement('table');
          table.innerHTML = '<tr><th>Order</th><th>Booking</th><th>Room</th><th>Items</th><th>Total</th><th>Status</th></tr>';
          orders.forEach(function (o) {
            const row = table.insertRow();
            [o.code, o.reservation, o.zone, orderItemsText(o), money(o.total)].forEach(v => { row.insertCell().textContent = v; });
            row.insertCell().appendChild(statusPill(o.status));
          });
          ordersBox.appendChild(table);
        }
      }
      render();
    }
    });
  </script>
</body>
</html>
